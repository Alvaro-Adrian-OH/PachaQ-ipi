<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <title>Diagnóstico de vivienda - Ubicación - PachaQ’ipi</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="icon" type="image/jpeg" href="../favicon.jpg">

<body data-page="plan">
  <div class="site-layout" id="site-layout">
    <header class="site-header" id="site-header"></header>
    <aside class="side-navigation" id="side-navigation" aria-label="Navegación principal"></aside>
    <main class="main-content">
      <section class="page-content page-section" aria-labelledby="page-title">
        <header class="page-head"><p class="eyebrow">Evaluación del hogar</p><h1 id="page-title">Ubicación y entorno</h1><p class="lead">Identifica los riesgos que podrían afectar a tu vivienda.</p></header>
        <div class="steps" aria-label="Paso 3 de 4"><div class="progress-track"><span class="progress-fill-75"></span></div><span class="step-label">Paso 3 de 4</span></div>

          <h2 class="eyebrow" id="location-title">Entorno de la vivienda</h2>

            <button class="option" type="button" data-select="location" data-value="Suelo plano o urbano firme" aria-pressed="false"><span><strong>Suelo plano o urbano firme</strong><small>Riesgo menor de deslizamiento</small></span><span class="option-state">Elegir</span></button>
          </div>
        </section>
        <div class="button-row"><a class="button secondary" href="assessment-floors.html">Atrás</a><a class="button green full" href="assessment-review.html">Siguiente: resumen</a></div>

    </main>
    <nav class="mobile-navigation" id="mobile-navigation" aria-label="Navegación para móvil"></nav>
