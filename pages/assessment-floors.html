<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Registra los pisos y el estado de construcción de tu hogar.">
  <title>Diagnóstico de vivienda - Pisos - PachaQ’ipi</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="icon" type="image/jpeg" href="../favicon.jpg">
</head>
<body data-page="plan">
  <div class="site-layout" id="site-layout">
    <header class="site-header" id="site-header"></header>
    <aside class="side-navigation" id="side-navigation" aria-label="Navegación principal"></aside>
    <main class="main-content">
      <section class="page-content page-section" aria-labelledby="page-title">
        <header class="page-head"><p class="eyebrow">Evaluación del hogar</p><h1 id="page-title">Pisos y estado</h1><p class="lead">Cuéntanos cuántos niveles tiene tu vivienda y en qué condición se encuentra.</p></header>
        <div class="steps" aria-label="Paso 2 de 4"><div class="progress-track"><span class="progress-fill-50"></span></div><span class="step-label">Paso 2 de 4</span></div>
        <section aria-labelledby="floors-title">
          <h2 class="eyebrow" id="floors-title">Número de pisos</h2>
          <div class="option-list">
            <button class="option" type="button" data-select="floors" data-value="1 piso" aria-pressed="false"><span><strong>1 piso</strong><small>Vivienda de un nivel</small></span><span class="option-state">Elegir</span></button>
            <button class="option" type="button" data-select="floors" data-value="2 pisos" aria-pressed="true"><span><strong>2 pisos</strong><small>Vivienda de dos niveles</small></span><span class="option-state">Seleccionado</span></button>
            <button class="option" type="button" data-select="floors" data-value="3 o más pisos" aria-pressed="false"><span><strong>3 o más pisos</strong><small>Vivienda de varios niveles</small></span><span class="option-state">Elegir</span></button>
          </div>
        </section>
        <section class="section-spaced" aria-labelledby="construction-title">
          <h2 class="eyebrow" id="construction-title">Estado de construcción</h2>
          <div class="option-list">
            <button class="option" type="button" data-select="construction" data-value="Terminada totalmente" aria-pressed="true"><span><strong>Terminada totalmente</strong></span><span class="option-state">Seleccionado</span></button>
            <button class="option" type="button" data-select="construction" data-value="En construcción o ampliación" aria-pressed="false"><span><strong>En construcción o ampliación</strong></span><span class="option-state">Elegir</span></button>
            <button class="option" type="button" data-select="construction" data-value="Antigua o con rajaduras" aria-pressed="false"><span><strong>Antigua o con rajaduras</strong></span><span class="option-state">Elegir</span></button>
          </div>
        </section>
        <div class="button-row"><a class="button secondary" href="assessment-material.html">Atrás</a><a class="button green full" href="assessment-location.html">Siguiente: ubicación</a></div>
      </section>
    </main>
    <nav class="mobile-navigation" id="mobile-navigation" aria-label="Navegación para móvil"></nav>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
