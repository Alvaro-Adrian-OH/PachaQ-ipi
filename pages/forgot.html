<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Recupera el acceso a tu cuenta de PachaQ’ipi.">
  <title>Recuperar contraseña - PachaQ’ipi</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="icon" type="image/jpeg" href="../favicon.jpg">
</head>
<body data-page="forgot">
  <div class="site-layout auth-layout" id="site-layout">
    <header class="site-header" id="site-header"></header>
    <aside class="side-navigation" id="side-navigation" aria-label="Navegación principal"></aside>
    <main class="main-content">
      <section class="auth-recovery" aria-labelledby="page-title">
        <header class="page-head">
          <p class="eyebrow">Cuenta · Recuperación</p>
          <h1 id="page-title">Recuperar contraseña</h1>
          <p class="lead">Ingresa tu correo para recibir un enlace seguro de restablecimiento.</p>
        </header>
        <form class="stack" data-form="forgot">
          <div class="field">
            <label for="reset-email">Correo registrado</label>
            <input id="reset-email" name="email" type="email" placeholder="nombre@correo.com" autocomplete="email" required>
          </div>
          <button class="button green full" type="submit">Enviar enlace de recuperación</button>
        </form>
        <section class="card soft space-top-large" aria-labelledby="biometric-title" data-simple-hide>
          <h2 id="biometric-title">Acceso biométrico</h2>
          <p class="muted">Podrás ingresar con Face ID o huella cuando esta opción esté configurada.</p>
          <button class="button secondary full small" type="button" data-action="biometric">Consultar disponibilidad</button>
        </section>
        <p class="space-top-medium"><a class="text-button" href="login.html">Volver a iniciar sesión</a></p>
      </section>
    </main>
    <nav class="mobile-navigation" id="mobile-navigation" aria-label="Navegación para móvil"></nav>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
